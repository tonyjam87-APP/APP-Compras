<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Remito desde Google Sheets</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #000; padding: 8px; text-align: left; }
    .info { margin-bottom: 20px; }
    .info label { display: inline-block; width: 120px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Remito</h2>
  <input type="text" id="ocNumber" placeholder="Número de OC" />
  <button onclick="generarRemito()">Generar Remito</button>

  <div class="info">
    <p><label>Cliente:</label> <span id="proveedor"></span></p>
    <p><label>Nº Remito:</label> <span id="remito"></span></p>
    <p><label>Nº OC:</label> <span id="oc"></span></p>
    <p><label>Fecha:</label> <span id="fecha"></span></p>
  </div>

  <table>
    <thead id="tabla-encabezados"></thead>
    <tbody id="tabla-datos"></tbody>
  </table>

  <div style="margin-top:20px;">
    <h3>Código QR</h3>
    <div id="qrcode"></div>
  </div>

  <pre id="debug"></pre>

  <script>
    async function generarRemito() {
      const ocNumber = document.getElementById("ocNumber").value.trim().replace(/^0+/, "");

      const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRsv8ohOjoWHL0oC7ZRLqp9ThGYlQoGii16B8Yq7GS_46qTK1Hf_EuSYdN-MfQC4ezi891NsFtdQVZ-/pub?output=csv";
      const response = await fetch(url);
      const csvText = await response.text();

      const rows = csvText.trim().split("\n").map(r => r.split(","));
      const headers = rows[0].map(h => h.trim());
      const data = rows.slice(1).map(r => {
        let obj = {};
        headers.forEach((h, i) => {
          obj[h] = r[i] ? r[i].trim().replace(/^"|"$/g, "") : "";
        });
        return obj;
      });

      // Mostrar todas las OCs detectadas
      document.getElementById("debug").innerText = "Todas las OCs detectadas:\n" + data.map(r => r.OC).join("\n");

      // Filtrar por la OC ingresada (flexible)
      const ocRows = data.filter(r => {
        if (!r.OC) return false;
        const valorOC = r.OC.trim().replace(/^0+/, "");
        return valorOC === ocNumber;
      });

      if (ocRows.length > 0) {
        const primera = ocRows[0];
        document.getElementById("proveedor").innerText = primera.PROVEEDOR || "";
        document.getElementById("remito").innerText = primera.REMITO || "";
        document.getElementById("oc").innerText = primera.OC || "";
        document.getElementById("fecha").innerText = primera.FECHA || "";

        const thead = document.getElementById("tabla-encabezados");
        thead.innerHTML = "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";

        const tbody = document.getElementById("tabla-datos");
        tbody.innerHTML = "";
        ocRows.forEach(r => {
          const fila = "<tr>" + headers.map(h => `<td>${r[h]}</td>`).join("") + "</tr>";
          tbody.innerHTML += fila;
        });

        const datosCrudos = JSON.stringify(ocRows, null, 2);
        document.getElementById("qrcode").innerHTML = "";
        new QRCode(document.getElementById("qrcode"), {
          text: datosCrudos,
          width: 200,
          height: 200
        });
      } else {
        alert("OC no encontrada en Google Sheets");
      }
    }
  </script>
</body>
</html>
