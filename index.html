<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Remito</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #333;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    caption {
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h2>Generar Remito</h2>
  <input type="text" id="ocNumber" placeholder="Ingrese número de OC">
  <button onclick="generarRemito()">Generar</button>

  <table id="tabla-remito">
    <caption>Detalle del Remito</caption>
    <thead id="tabla-encabezados"></thead>
    <tbody id="tabla-datos"></tbody>
  </table>

<script>
async function generarRemito() {
  const ocNumber = document.getElementById("ocNumber").value.trim();
  const url = "TU_URL_DEL_SHEET_PUBLICADO_EN_CSV"; // reemplazar con tu link CSV
  const response = await fetch(url);
  const csvText = await response.text();

  const rows = csvText.trim().split("\n").map(r => r.split(","));
  const headers = rows[0].map(h => h.trim());
  const data = rows.slice(1).map(r => {
    let obj = {};
    headers.forEach((h, i) => obj[h] = r[i] ? r[i].trim() : "");
    return obj;
  });

  // Buscar columna OC dinámicamente
  const ocHeader = headers.find(h => h.toUpperCase() === "OC");
  if (!ocHeader) {
    alert("No se encontró la columna OC en el Sheet");
    return;
  }

  // Filtrar por OC
  const ocRows = data.filter(r => r[ocHeader] === ocNumber);

  if (ocRows.length > 0) {
    // Armar encabezados dinámicamente
    const thead = document.getElementById("tabla-encabezados");
    thead.innerHTML = "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";

    // Armar filas dinámicamente
    const tbody = document.getElementById("tabla-datos");
    tbody.innerHTML = "";
    ocRows.forEach(r => {
      const fila = "<tr>" + headers.map(h => `<td>${r[h]}</td>`).join("") + "</tr>";
      tbody.innerHTML += fila;
    });
  } else {
    alert("OC no encontrada en Google Sheets");
  }
}
</script>
</body>
</html>
